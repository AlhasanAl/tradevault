{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block heading %}Log in{% endblock %}
{% block content %}
<section class="panel">
  <form method="post" action="{{ url_for('login') }}">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" type="text" name="username" value="{{ username }}" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="wide">Log in</button>
  </form>
  <p class="auth-foot">New to TradeVault? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
